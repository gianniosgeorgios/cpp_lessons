name: Grade C++ array exercises

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      exercise:
        description: 'Exercise directory name (e.g. day_01, day_02)'
        required: true
        default: 'day_01'
      student_code:
        description: 'Student C++ code'
        required: true

jobs:
  grade:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y g++ python3

      - name: Write student solution
        run: |
          mkdir -p student
          cat << 'EOF' > student/solution.cpp
          ${{ github.event.inputs.student_code }}
          EOF

      - name: Run grader
        run: |
          python3 scripts/grade.py --exercise "exercises/${{ github.event.inputs.exercise }}" --source student/solution.cpp

