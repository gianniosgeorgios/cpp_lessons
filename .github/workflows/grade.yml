name: Grade C submissions

on:
  pull_request:
    paths:
      - 'submissions/**'
      - 'student/**'
  push:
    paths:
      - 'submissions/**'
      - 'student/**'

jobs:
  grade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show files
        run: ls -R
      - name: Run grader
        run: |
          python3 scripts/grade.py
