name: Grade C++ array exercises
run-name: ${{ github.event_name == 'workflow_dispatch' && format('grade-{0}', inputs.submission_id) || github.event.head_commit.message }}

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      exercise:
        description: "Exercise directory (e.g. day_01)"
        required: true
      submission_id:
        description: "Dashboard submission id"
        required: true
      code_b64:
        description: "Base64 encoded solution.cpp"
        required: true

jobs:
  grade:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        if: github.event_name != 'workflow_dispatch'
        run: sudo apt-get update && sudo apt-get install -y g++ python3

      - name: Run grader
        if: github.event_name != 'workflow_dispatch'
        run: python3 scripts/grade.py

      - name: Grade dashboard submission
        if: github.event_name == 'workflow_dispatch'
        env:
          CODE_B64: ${{ inputs.code_b64 }}
          EXERCISE: ${{ inputs.exercise }}
        run: |
          echo "$CODE_B64" | base64 -d > "$RUNNER_TEMP/solution.cpp"
          set +e
          /usr/bin/time -f "%e %M" -o "$RUNNER_TEMP/usage.txt" python3 scripts/grade.py --exercise "exercises/$EXERCISE" --source "$RUNNER_TEMP/solution.cpp" > "$RUNNER_TEMP/out.txt" 2>&1
          code=$?
          echo "===DASHBOARD_RESULT_BEGIN==="
          echo "EXIT $code"
          echo "USAGE $(cat $RUNNER_TEMP/usage.txt | tail -1)"
          base64 -w0 "$RUNNER_TEMP/out.txt"; echo
          echo "===DASHBOARD_RESULT_END==="
          exit 0

